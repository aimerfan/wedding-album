# 婚禮相簿的 nginx 設定：單機部署，上傳與其他 API 分給兩個 gunicorn 池
#
# 放到 /etc/nginx/sites-available/ 再連到 sites-enabled/。
# 要依主機修改的只有：server_name、憑證路徑，以及下面三個路徑（要跟 deploy/wedding-album.env 一致）：
#   /srv/wedding-album/frontend/dist   前端建置結果
#   /var/lib/wedding-album/media/      照片檔（= MEDIA_DIR）

upstream wedding_api    { server 127.0.0.1:8000; }  # 瀏覽、讚、祝福…（wedding-album-api.service）
upstream wedding_upload { server 127.0.0.1:8001; }  # 只處理上傳（wedding-album-upload.service）

# /api/photos 同一個網址：POST 是上傳，GET 是列表，依方法分到不同的池
map $request_method $wedding_photos_pool {
    POST    wedding_upload;
    default wedding_api;
}

server {
    listen 80;
    listen [::]:80;
    server_name album.example.com;
    return 301 https://$host$request_uri;
}

server {
    # 舊寫法：Ubuntu 24.04 的 nginx 1.24 還不認得 `http2 on;`，新版遇到這行只會警告
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name album.example.com;

    # Cloudflare 的 Origin Certificate（SSL 模式設 Full (strict)），見 deploy/README.md
    ssl_certificate     /etc/ssl/wedding-album/origin.pem;
    ssl_certificate_key /etc/ssl/wedding-album/origin.key;

    root /srv/wedding-album/frontend/dist;

    # 上傳以外的請求都很小；上傳另外在下面放寬
    client_max_body_size 1m;

    # 送到 Cloudflare 的路上也壓縮，省主機頻寬（照片影片本來就壓縮過，不列）
    gzip on;
    gzip_types application/json application/javascript text/css application/manifest+json;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- API ---------------------------------------------------------------

    location = /api/photos {
        # 比後端的上限（MAX_VIDEO_BYTES + 1 MB）略大：超過時由 Flask 回 JSON 格式的 413，前端才看得懂
        client_max_body_size 100m;
        # 兩次收到資料之間最多等多久（不是整個上傳的時間），會場網路卡住一下不至於斷掉
        client_body_timeout 120s;
        # 預設就是 on，寫出來是因為分池靠它：nginx 先把整個檔案收完才交給 gunicorn，
        # 網路慢的手機只會佔住 nginx，不會佔住後端的 worker
        proxy_request_buffering on;
        # 收完之後後端處理（算雜湊、HEIC 轉檔、抓影片封面）的時間
        proxy_read_timeout 150s;
        proxy_pass http://$wedding_photos_pool;
    }

    location /api/ {
        proxy_read_timeout 30s;
        proxy_pass http://wedding_api;
    }

    # --- 照片檔 ------------------------------------------------------------
    # 由 nginx 直接從磁碟送出，Flask 正式環境不提供 /media。影片播放需要的 Range 請求 nginx 本身就支援

    location /media/ {
        alias /var/lib/wedding-album/media/;
        # 系統的 mime.types 沒有 heic；在 location 裡寫 types 會整個取代，所以全部列出
        types {
            image/jpeg      jpg;
            image/png       png;
            image/webp      webp;
            image/heic      heic;
            video/mp4       mp4;
            video/quicktime mov;
        }
        default_type application/octet-stream;
        # 檔名含照片 id，內容不會變：讓 Cloudflare 與手機長期快取。刪掉的照片要清 Cloudflare 快取，見 README
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # --- 前端（PWA） -------------------------------------------------------

    # Vite 產生的檔名帶雜湊，內容變了檔名就變
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 這幾個檔名固定，不能被快取住，否則改版後賓客的手機一直拿到舊版
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # 前端路由（/photos/xxx 之類）都交給 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
