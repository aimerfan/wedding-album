<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF6F0" />
    <!-- iOS 加到主畫面後以全螢幕開啟 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="婚禮相簿" />

    <!--
      中文字型很肥，Google Fonts 會依 unicode-range 切片，
      瀏覽器只會下載實際用到的子集。字型檔由 Service Worker 快取（見 vite.config.ts）。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>婚禮相簿</title>
  </head>
  <body>
    <!--
      iPhone 從主畫面打開時，網址就是 manifest 的 start_url，而且讀不到 Safari 存下的活動碼。
      有活動碼就改用後端產生的 manifest（start_url 帶上 ?code=），從主畫面打開才加入得了相簿。
      放在 body 開頭：vite-plugin-pwa 插入的 manifest 連結在 head 裡，這時已經有了。
      活動碼的來源跟 src/stores/session.ts 的 initialEventCode 一致。
    -->
    <script>
      ;(function () {
        var link = document.querySelector('link[rel="manifest"]')
        var code = location.pathname === '/admin' ? '' : new URLSearchParams(location.search).get('code')
        if (!code) {
          try {
            code = localStorage.getItem('wedding-album:event-code')
          } catch (e) {}
        }
        if (link && code) link.href = '/api/manifest?code=' + encodeURIComponent(code)
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
